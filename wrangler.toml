name = "cloudflare-cors-anywhere"
main = "index.js"
compatibility_date = "2026-01-31"
workers_dev = true

[[routes]]
pattern = "cors-anywhere.disign.me/*"
zone_name = "disign.me" 

# To use KV storage for blacklistUrls and whitelistOrigins:
# 1. Create a KV namespace: `wrangler kv:namespace create CORS_KV`
# 2. Add the binding configuration below with your ID
[[kv_namespaces]]
binding = "KV"
id = "c00d167c95d844e38ede8d4200a296c0"

[vars]
# 十分钟限制
LIMIT_10M_PER_IP_ORIGIN = "300"
# 一天的限制
LIMIT_1D_PER_IP_ORIGIN = "5000"

# 10分钟桶计数的过期时间（秒）：建议 2 小时，避免边界抖动 + 让短期排查更方便
TTL_10M_BUCKET_TTL = "7200"

# 日桶计数的过期时间（秒）：建议 2 天，覆盖跨日边界 + 留一点回溯窗口
TTL_1D_BUCKET_TTL = "172800"

[durable_objects]
bindings = [
  { name = "RATE_LIMITER", class_name = "RateLimiterDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterDO"]